[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stealthwall"
version = "0.1.0"
description = "ML-driven intrusion prevention middleware for FastAPI - detects recon/scans, brute force, and injection patterns, blocks automatically with graduated response."
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "starlette>=0.36",
]

[project.optional-dependencies]
# Heavy inference deps stay OPTIONAL so `pip install stealthwall` remains
# light; install these when serving a trained ONNX model.
ml = ["onnxruntime>=1.17", "numpy>=1.26"]
dev = ["fastapi>=0.110", "httpx>=0.27", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["stealthwall_fastapi*"]

[project.urls]
Homepage = "https://example.invalid/stealthwall"
