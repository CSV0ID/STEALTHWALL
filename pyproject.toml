[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stealthwall"
version = "5.0.0"
description = "Self-Hosted ML-Driven Intrusion Prevention Middleware & Web Application Firewall"
readme = "README.md"
authors = [
    { name = "Chinmay Shinde", email = "chinmayshinde247@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]
dependencies = [
    "starlette>=0.36",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "numpy>=1.24",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.17", "skl2onnx>=1.16", "onnxmltools>=1.12", "lightgbm>=4.0", "xgboost>=2.0"]
redis = ["redis>=5.0"]
monitoring = ["prometheus-client>=0.20"]
all = [
    "onnxruntime>=1.17",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "websockets>=12.0",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/CSV0ID/STEALTHWALL"
Repository = "https://github.com/CSV0ID/STEALTHWALL"
Documentation = "https://github.com/CSV0ID/STEALTHWALL/tree/main/docs"
Issues = "https://github.com/CSV0ID/STEALTHWALL/issues"

[project.scripts]
stealthwall = "stealthwall.stealthwall_cli:main"

[tool.setuptools.packages.find]
include = ["stealthwall*"]

[tool.setuptools.package-data]
stealthwall = ["**/*"]
