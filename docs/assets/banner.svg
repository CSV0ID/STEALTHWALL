<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#0e172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="cyanOrb" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleOrb" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="50%" stop-color="rgba(56,189,248,0.6)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0.3)"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; font-size: 58px; letter-spacing: -1.5px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 20px; letter-spacing: 0.2px; fill: #94a3b8; }
    .badge-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12.5px; font-weight: 600; fill: #e0f2fe; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGlow)"/>
  <rect width="1200" height="380" rx="16" fill="url(#cyanOrb)"/>
  <rect width="1200" height="380" rx="16" fill="url(#purpleOrb)"/>
  <rect width="1198" height="378" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Cyber Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
  </g>

  <!-- Top Release Pill -->
  <g transform="translate(600, 52)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <circle cx="-136" cy="0" r="4.5" fill="#34d399" filter="url(#glow)"/>
    <text x="0" y="4.5" text-anchor="middle" class="badge-text">v5.0.0 • PRODUCTION RELEASE</text>
  </g>

  <!-- Shield Brand Icon (Center Left) -->
  <g transform="translate(180, 190) scale(1.15)">
    <!-- Outer Glow Shield -->
    <path d="M0 -55 L45 -32 L45 18 C45 42 0 62 0 62 C0 62 -45 42 -45 18 L-45 -32 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" filter="url(#glow)"/>
    <!-- Core Solid Shield -->
    <path d="M0 -50 L40 -30 L40 15 C40 38 0 55 0 55 C0 55 -40 38 -40 15 L-40 -30 Z" fill="url(#shieldGrad)"/>
    <!-- Inner S Symbol -->
    <path d="M-10 -22 C-10 -22 12 -22 12 -10 C12 0 -12 2 -12 14 C-12 24 12 24 12 24" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Main Headline & Pitch -->
  <text x="270" y="172" class="title">STEALTHWALL</text>
  <text x="270" y="212" class="subtitle">Sub-Millisecond ML Intrusion Prevention System &amp; Intelligent WAF</text>

  <!-- Key Capability Badges (Bottom Center) -->
  <g transform="translate(270, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#38bdf8"/>
      <text x="32" y="22.5" class="node-text">&lt;0.8ms ONNX Eval</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(178, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#34d399"/>
      <text x="32" y="22.5" class="node-text">14 Entropy Features</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(371, 0)">
      <rect x="0" y="0" width="175" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#a855f7"/>
      <text x="32" y="22.5" class="node-text">0-Day Heuristics</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(559, 0)">
      <rect x="0" y="0" width="195" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#fbbf24"/>
      <text x="32" y="22.5" class="node-text">Zero Cloud Telemetry</text>
    </g>
  </g>
</svg>
