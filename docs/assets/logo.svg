<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Dark Clear Red Facet Gradients -->
    <linearGradient id="logoFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a55"/>
      <stop offset="60%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#1f040a"/>
    </linearGradient>

    <linearGradient id="logoFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#140307"/>
    </linearGradient>

    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.8)"/>
      <stop offset="50%" stop-color="rgba(255, 42, 85, 0.95)"/>
      <stop offset="100%" stop-color="rgba(190, 18, 60, 0.7)"/>
    </linearGradient>

    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="60" cy="60" r="46" fill="#e11d48" opacity="0.35" filter="url(#logoGlow)"/>

  <!-- Outer Hexagonal Wireframe Ring -->
  <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" fill="rgba(15, 3, 7, 0.9)" stroke="url(#logoBorder)" stroke-width="2.5"/>

  <!-- Left Facet -->
  <path d="M60 14 L100 37 L100 83 L60 106 Z" fill="url(#logoFacetLeft)" opacity="0.95"/>
  <!-- Right Facet -->
  <path d="M60 14 L20 37 L20 83 L60 106 Z" fill="url(#logoFacetRight)" opacity="0.9"/>

  <!-- Center Chrome Ridge Line -->
  <line x1="60" y1="14" x2="60" y2="106" stroke="#ffffff" stroke-width="2" filter="url(#logoGlow)"/>

  <!-- Geometric 'S' Singularity Monogram -->
  <path d="M38 46 L60 82 L82 46" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>

  <!-- Central Laser Core -->
  <circle cx="60" cy="62" r="5" fill="#ff2a55" filter="url(#logoGlow)"/>
  <circle cx="60" cy="62" r="2" fill="#ffffff"/>
</svg>
