<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Chinmay Signature Gradients (Periwinkle #7F77DD, Coral #ff6b6b, Cyan #5EEAD4) -->
    <linearGradient id="logoFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d95f0"/>
      <stop offset="60%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>

    <linearGradient id="logoFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9f8f"/>
      <stop offset="60%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.7)"/>
      <stop offset="50%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>

    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="60" cy="60" r="44" fill="#7F77DD" opacity="0.25" filter="url(#logoGlow)"/>

  <!-- Outer Hexagonal Ring -->
  <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" fill="rgba(15, 11, 10, 0.92)" stroke="url(#logoBorder)" stroke-width="2"/>

  <!-- Left Facet -->
  <path d="M60 14 L100 37 L100 83 L60 106 Z" fill="url(#logoFacetLeft)" opacity="0.95"/>
  <!-- Right Facet -->
  <path d="M60 14 L20 37 L20 83 L60 106 Z" fill="url(#logoFacetRight)" opacity="0.9"/>

  <!-- Center Chrome Ridge Line -->
  <line x1="60" y1="14" x2="60" y2="106" stroke="#EDEBE6" stroke-width="1.8" filter="url(#logoGlow)"/>

  <!-- Geometric 'S' Singularity Monogram -->
  <path d="M38 46 L60 82 L82 46" fill="none" stroke="#EDEBE6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>

  <!-- Central Mint Cyan Laser Core -->
  <circle cx="60" cy="62" r="5" fill="#5EEAD4" filter="url(#logoGlow)"/>
  <circle cx="60" cy="62" r="2" fill="#EDEBE6"/>
</svg>
