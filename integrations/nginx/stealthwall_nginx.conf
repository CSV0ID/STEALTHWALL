# STEALTHWALL — Universal Nginx Reverse Proxy Protection Snippet
# Protects ANY website (HTML, PHP, WordPress, Go, Ruby, Java) with ZERO code changes.

server {
    listen 80;
    server_name example.com;

    # 1. Forward request verification to StealthWall daemon
    location = /_stealthwall_auth {
        internal;
        proxy_pass http://127.0.0.1:9377/internal/decide;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 50ms;
        proxy_read_timeout 50ms;
    }

    # 2. Main website location
    location / {
        auth_request /_stealthwall_auth;

        # Target application or static HTML / PHP root:
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Custom 403 Forbidden page when blocked by StealthWall
    error_page 403 /403_stealthwall.html;
    location = /403_stealthwall.html {
        return 403 '{"error": "Forbidden", "message": "Access blocked by StealthWall ML intrusion prevention"}';
    }
}
